<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Arsela Gjonaj</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

    <!-- Header Wrapper -->
    <div class="page-header-wrapper" style="min-height: 100vh; padding-top: 6rem; padding-bottom: 2rem;">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg fixed-top">
            <div class="container-fluid px-4">
                <a class="navbar-brand fw-bold text-uppercase" href="index.html" style="letter-spacing: 1px;">Arsela Gjonaj</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto bg-white bg-opacity-25 rounded-pill px-3 py-1 backdrop-blur">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">How it works</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Features</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container h-100 d-flex align-items-center justify-content-center">
            <div class="card p-4 p-md-5 border-0 shadow-lg" style="max-width: 450px; width: 100%; border-radius: 1.5rem; background: rgba(255, 255, 255, 0.95); color: #333;">
                <div class="text-center mb-4">
                    <h2 class="fw-bold" style="color: #ff6b6b;">Welcome Back</h2>
                    <p class="text-muted small">Enter your credentials to access your account</p>
                </div>

                <form>
                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control bg-light border-0 p-2" id="email" placeholder="name@example.com">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">Password</label>
                        <div class="input-group">
                             <span class="input-group-text bg-light border-0"><i class="bi bi-lock text-muted"></i></span>
                             <input type="password" class="form-control bg-light border-0 p-2" id="password" placeholder="Enter your password">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label small" for="rememberMe">Remember me</label>
                        </div>
                        <a href="forgot-password.html" class="small text-decoration-none" style="color: #a06cd5;">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn btn-gradient-pink w-100 py-2 fw-bold shadow-sm">Sign In</button>

                    <div class="text-center mt-4">
                        <span class="text-muted small">Don't have an account?</span>
                        <a href="register.html" class="fw-bold text-decoration-none ms-1" style="color: #ff6b6b;">Sign up</a>
                    </div>

                     <div class="position-relative my-4">
                        <hr class="text-muted opacity-25">
                        <span class="position-absolute top-50 start-50 translate-middle bg-white px-2 small text-muted">OR</span>
                    </div>

                    <div class="d-flex justify-content-center gap-2">
                        <a href="#" class="btn btn-outline-light text-dark border shadow-sm rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;"><i class="bi bi-google"></i></a>
                        <a href="#" class="btn btn-outline-light text-dark border shadow-sm rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;"><i class="bi bi-facebook"></i></a>
                        <a href="#" class="btn btn-outline-light text-dark border shadow-sm rounded-circle d-flex align-items-center justify-content-center" style="width: 40px; height: 40px;"><i class="bi bi-apple"></i></a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="fancy-footer">
        <div class="container text-center">
            <p class="text-muted small mb-0">&copy; 2023 Arsela Gjonaj. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
