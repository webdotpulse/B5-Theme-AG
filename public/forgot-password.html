<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Arsela Gjonaj</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

    <!-- Header Wrapper -->
    <div class="page-header-wrapper" style="min-height: 100vh; padding-top: 6rem; padding-bottom: 2rem;">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg fixed-top">
            <div class="container-fluid px-4">
                <a class="navbar-brand fw-bold text-uppercase" href="index.html" style="letter-spacing: 1px;">Arsela Gjonaj</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto bg-white bg-opacity-25 rounded-pill px-3 py-1 backdrop-blur">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">How it works</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Features</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container h-100 d-flex align-items-center justify-content-center">
            <div class="card p-4 p-md-5 border-0 shadow-lg" style="max-width: 450px; width: 100%; border-radius: 1.5rem; background: rgba(255, 255, 255, 0.95); color: #333;">
                <div class="text-center mb-4">
                    <div class="bg-light rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 80px; height: 80px;">
                        <i class="bi bi-key" style="font-size: 2rem; color: #a06cd5;"></i>
                    </div>
                    <h2 class="fw-bold" style="color: #ff6b6b;">Forgot Password?</h2>
                    <p class="text-muted small">No worries, we'll send you reset instructions.</p>
                </div>

                <form>
                    <div class="mb-4">
                        <label for="email" class="form-label fw-bold">Email Address</label>
                         <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control bg-light border-0 p-2" id="email" placeholder="name@example.com">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-gradient-pink w-100 py-2 fw-bold shadow-sm">Reset Password</button>

                    <div class="text-center mt-4">
                        <a href="login.html" class="fw-bold text-decoration-none small" style="color: #555;"><i class="bi bi-arrow-left me-1"></i> Back to Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="fancy-footer">
        <div class="container text-center">
            <p class="text-muted small mb-0">&copy; 2023 Arsela Gjonaj. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
