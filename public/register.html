<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Arsela Gjonaj</title>
    <link rel="stylesheet" href="css/style.css">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

    <!-- Header Wrapper -->
    <div class="page-header-wrapper" style="min-height: 100vh; padding-top: 6rem; padding-bottom: 2rem;">
        <!-- Navbar -->
        <nav class="navbar navbar-expand-lg fixed-top">
            <div class="container-fluid px-4">
                <a class="navbar-brand fw-bold text-uppercase" href="index.html" style="letter-spacing: 1px;">Arsela Gjonaj</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav mx-auto bg-white bg-opacity-25 rounded-pill px-3 py-1 backdrop-blur">
                        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">How it works</a></li>
                        <li class="nav-item"><a class="nav-link" href="#">Features</a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="container h-100 d-flex align-items-center justify-content-center">
            <div class="card p-4 p-md-5 border-0 shadow-lg" style="max-width: 500px; width: 100%; border-radius: 1.5rem; background: rgba(255, 255, 255, 0.95); color: #333;">
                <div class="text-center mb-4">
                    <h2 class="fw-bold" style="color: #ff6b6b;">Join the Community</h2>
                    <p class="text-muted small">Create your account and start your journey</p>
                </div>

                <form>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="firstName" class="form-label fw-bold">First Name</label>
                            <input type="text" class="form-control bg-light border-0 p-2" id="firstName" placeholder="John">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="lastName" class="form-label fw-bold">Last Name</label>
                            <input type="text" class="form-control bg-light border-0 p-2" id="lastName" placeholder="Doe">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label fw-bold">Email Address</label>
                         <div class="input-group">
                            <span class="input-group-text bg-light border-0"><i class="bi bi-envelope text-muted"></i></span>
                            <input type="email" class="form-control bg-light border-0 p-2" id="email" placeholder="name@example.com">
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">Password</label>
                        <div class="input-group">
                             <span class="input-group-text bg-light border-0"><i class="bi bi-lock text-muted"></i></span>
                             <input type="password" class="form-control bg-light border-0 p-2" id="password" placeholder="Create a password">
                        </div>
                    </div>
                     <div class="mb-3">
                        <label for="confirmPassword" class="form-label fw-bold">Confirm Password</label>
                        <div class="input-group">
                             <span class="input-group-text bg-light border-0"><i class="bi bi-lock text-muted"></i></span>
                             <input type="password" class="form-control bg-light border-0 p-2" id="confirmPassword" placeholder="Confirm your password">
                        </div>
                    </div>

                    <div class="form-check mb-4">
                        <input class="form-check-input" type="checkbox" id="terms" required>
                        <label class="form-check-label small text-muted" for="terms">
                            I agree to the <a href="#" class="text-decoration-none" style="color: #a06cd5;">Terms of Service</a> and <a href="#" class="text-decoration-none" style="color: #a06cd5;">Privacy Policy</a>
                        </label>
                    </div>

                    <button type="submit" class="btn btn-gradient-pink w-100 py-2 fw-bold shadow-sm">Sign Up</button>

                    <div class="text-center mt-4">
                        <span class="text-muted small">Already have an account?</span>
                        <a href="login.html" class="fw-bold text-decoration-none ms-1" style="color: #ff6b6b;">Sign in</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="fancy-footer">
        <div class="container text-center">
            <p class="text-muted small mb-0">&copy; 2023 Arsela Gjonaj. All rights reserved.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
